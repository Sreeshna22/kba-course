<!DOCTYPE html>
<html>
<head>
<title>Document</title>
</head>
<body>

<h3>Enter numbers </h3>
<input type="text" id="inputA">
<button onclick="arrayEnter()">submit</button>

<br><br>

<label>Search: </label>
<input type="number" id="searchInput">
<button onclick="search()">Go</button>
<p id="resultsearch"></p>


<div id="output"></div>

<script>
  let myArray = [];

  function arrayEnter() {
    const input = document.getElementById("inputA").value;
    const parts = input.split(",");
    const arr = [];

    for (let i = 0; i < parts.length; i++) {
      const num = Number(parts[i].trim());
      if (!isNaN(num)) {
        arr.push(num);
      }
    }

    if (arr.length === 0) {
      alert("Enter valid numbers!");
      return;
    }

    myArray = arr;

    let result = "";

    result += `<label>Select index: </label>
               <select id="Select" onchange="showIndex()">`;
    for (let i = 0; i < arr.length; i++) {
      result += `<option value="${i}">${i}</option>`;
    }
    result += `</select>`;
    result += `<p id="Result1"></p>`;

    const sorted = arr.slice().sort((a, b) => a - b);
    result += `<p>The array in sorted order is: ${sorted.join(", ")}</p>`;


    const reversed = arr.slice().reverse();
    result += `<p>The reversed array is: ${reversed.join(", ")}</p>`;

    document.getElementById("output").innerHTML = result;
  }

  function showIndex() {
    const index = Number(document.getElementById("Select").value);
    const value = myArray[index];
    document.getElementById("Result1").innerText =
      `The index ${index} has the number ${value} in the array.`;
  }

  function search() {
    const value = Number(document.getElementById("searchInput").value);
    if (isNaN(value)) {
      document.getElementById("resultsearch").innerText = "Please enter a valid number.";
      return;
    }

    const index = myArray.indexOf(value);
    const msg = index !== -1
      ? `Found at index: ${index}`
      : "Not found";

    document.getElementById("resultsearch").innerText = msg;
  }
</script>

</body>
</html>
